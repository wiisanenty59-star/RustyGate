<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <title>RustyGate — Breach the Forgotten</title>

    <meta
      name="description"
      content="RustyGate — Invite-only urban exploration community. Explore abandoned places, hidden tunnels, rooftops, factories, drains, and forgotten infrastructure."
    />

    <meta
      name="keywords"
      content="urbex, urban exploration, abandoned places, tunnels, rooftops, drains, RustyGate"
    />

    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="RustyGate Forum" />

    <meta
      property="og:description"
      content="Invite-only urban exploration network. Breach the Forgotten."
    />

    <meta property="og:type" content="website" />

    <meta property="og:image" content="/rustygate.webp" />

    <meta property="og:image:width" content="1200" />

    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="RustyGate Forum" />

    <meta name="twitter:description" content="Document the abandoned." />

    <meta name="twitter:image" content="/rustygate.webp" />

    <!-- Theme -->
    <meta name="theme-color" content="#0b1118" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Main UI Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Industrial Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Preload Banner -->
    <link rel="preload" as="image" href="/rustygate.webp" />
  </head>

  <body>
    <!-- Background FX -->
    <div class="site-background"></div>

    <!-- CRT Scanlines -->
    <div class="scanlines"></div>

    <!-- RustyGate Hero Banner -->
    <header class="rustygate-banner">
      <div class="rustygate-banner-overlay"></div>

      <div class="rustygate-banner-content">
        <div class="rustygate-subtitle">
          INVITE ONLY URBAN EXPLORATION NETWORK
        </div>

        <h1 class="rustygate-title">RUSTYGATE</h1>

        <div class="rustygate-tagline">BREACH THE FORGOTTEN</div>

        <div class="rustygate-status">
          <span class="rustygate-status-dot"></span>
          NETWORK ACTIVE
        </div>
      </div>
    </header>

    <!-- Main App -->
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
